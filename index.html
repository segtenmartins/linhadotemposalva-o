 vencê-los",termos:["thlipsis megale (grande tribulação)","hagios (santos)","pelekizo (degolar com machado)"],type:"tribulacao",Icon:yt,detail:"NÃO É IRA DE DEUS. É ira de Satanás via homem. A Igreja vence perseverando. 144 mil selados, 2 testemunhas pregam.",highlight:"NÃO É IRA"},{id:8,title:"Sinais Cósmicos - 6º Selo",range:"Mateus 24:29 • Ap 6:12-13 • Joel 2:31",description:"Imediatamente APÓS a tribulação (eutheos). Sol negro como saco, lua sangue, estrelas caem. Céu se recolhe. Todos veem.",verse:"Mt 24:29 - Logo depois da tribulação daqueles dias, o sol escurecerá...",termos:["eutheos (imediatamente após)","seismos (grande terremoto)","skotos (escuridão)"],type:"sinais",Icon:kr,detail:"Transição divina. Marca o fim da thlipsis e o início iminente da orge. Joel 2:31 se cumpre aqui.",highlight:"TRANSIÇÃO"},{id:9,title:"Arrebatamento - Porta Fechada",range:"Mt 24:30-31 • 1Ts 4:16-17 • 1Co 15:52",description:"Cristo aparece nas nuvens. Última trombeta (eschate salpinx). Mortos em Cristo (incluindo degolados) ressuscitam PRIMEIRO, vivos transformados JUNTOS (hama).",verse:"1Ts 4:17 - Depois nós, os que ficarmos vivos, seremos arrebatados juntamente com eles",termos:["harpazo (arrebatar com força)","episunagoge (ajuntamento)","eschate salpinx (última trombeta)","hama (juntos)"],type:"arrebatamento",Icon:pr,detail:"PORTA FECHADA como na arca. Nenhum ímpio sobe. A partir daqui, NENHUMA SALVAÇÃO mais. O Espírito que restringe é retirado com a Igreja.",highlight:"HARPAZO"},{id:10,title:"Ira de Deus - 7 Taças",range:"Apocalipse 15-16",description:"Orge e Thymos puros. Derramada sobre os que ficaram e adoraram a besta. Ninguém se arrepende, só blasfêmia (blasphemeo). Juízo total, sem misericórdia.",verse:"Ap 16:9,11,21 - E blasfemaram contra Deus... e não se arrependeram",termos:["orge (ira vindicativa)","thymos (fúria)","blasphemeo (blasfemar)","krater (taça)"],type:"ira",Icon:Er,detail:"NENHUMA SALVAÇÃO DURANTE A IRA. Prova textual: 3x 'não se arrependeram'. Diferente
